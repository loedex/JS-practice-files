<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Event Object</title>
    <style>
        .box{
            width: 100px;
            height:100px;
            background-color: red;
            text-align: center;
            line-height: 100px;
            cursor: pointer;
        }
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" data-color="red">Box-1</div>
    <div class="box" style="background-color: yellow;" data-color="yellow">Box-2</div>
    <div class="box" style="background-color: pink;" data-color="pink">Box-3</div>
    <div class="box" style="background-color: black; color: white;" data-color="black">Box-4</div>
    </div>

    <p id="tell-color"> Clicked Color : </p>
    <p id="detail">Event Type : </p>



    <form id="myForm">
        <input type="text" placeholder="Enter Text">
        <button type="submit">Submit</button>
    </form>
    <script>
        const boxes = document.querySelectorAll('.box');
        let col = document.getElementById('tell-color');
        let det = document.getElementById('detail');


        function handleClick(e){
            let c = e.target.getAttribute('data-color');
            col.textContent = "Clicked Box Color : " + c;
            det.textContent = "Type of Event : "+ e.type;
            console.log(e.target);
        }


        boxes.forEach(b =>{
            b.addEventListener('click',handleClick)
        })



         const f = document.getElementById('myForm')
        f.addEventListener('submit',(e)=>{e.preventDefault();})
    </script>
</body>
</html>
